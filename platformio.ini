[platformio]
default_envs = esp32-sim

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  paulstoffregen/OneWire@2.3.8
  bblanchon/ArduinoJson@6.21.5
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -I include

[env:esp32-sim]
build_flags = ${env.build_flags} -DCERVEJINO_SIM=1 -DCERVEJINO_ENABLE_OUTPUTS=0

[env:esp32-bench]
build_flags = ${env.build_flags} -DCERVEJINO_SIM=0 -DCERVEJINO_ENABLE_OUTPUTS=0

; Output enable is intentionally NOT exposed as a runtime/menu setting.
; Review docs/HARDWARE.md before creating a commissioned build profile.
